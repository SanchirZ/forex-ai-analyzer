name: Signal alerts

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may delay a few minutes)
  workflow_dispatch:
    inputs:
      mode:
        description: "run = check signals, test = send a test message"
        default: "run"

concurrency:
  group: signal-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # remembers which signals were already sent, so each one is sent once
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Check signals and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_STATE: alert_state.json
        run: python alerts/notify.py ${{ github.event.inputs.mode || 'run' }}

      - name: Save alert state
        if: always() && hashFiles('alert_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
