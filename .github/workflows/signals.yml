name: Signal alerts

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may delay a few minutes)
  workflow_dispatch:
    inputs:
      mode:
        description: "run = check signals, test = send a test message"
        default: "run"

concurrency:
  group: signal-alerts
  cancel-in-progress: false

permissions:
  contents: write              # to update the journal on the `data` branch

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The live-signal journal lives on its own branch so that updating it
      # never redeploys the website (GitHub Pages) or the backend (Render).
      - name: Open the data branch
        run: |
          git config --global user.name "signal-bot"
          git config --global user.email "signal-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data:data
            git worktree add data data
          else
            git worktree add --detach data
            cd data
            git checkout --orphan data
            git rm -rqf . || true
            git clean -fdq
            echo "Live signal journal written by .github/workflows/signals.yml" > README.md
            git add README.md
            git commit -qm "Start signal journal"
          fi

      - name: Check signals, update journal, notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOURNAL: data/journal.json
        run: python alerts/notify.py ${{ github.event.inputs.mode || 'run' }}

      - name: Save the journal
        if: always()
        run: |
          cd data
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "Journal update"
          git push origin data
